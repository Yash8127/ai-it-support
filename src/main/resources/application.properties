spring.application.name=ai-it-support

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#JWT
jwt.secret=${JWT_SECRET}

server.port=8080

# Spring AI - Ollama

spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.options.model=llama3.2:latest

spring.ai.ollama.chat.num-ctx=4096

spring.ai.ollama.chat.options.num-predict=1000

spring.ai.ollama.chat.options.temperature=0

# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# reset password link
app.frontend.url=${FRONTEND_URL:http://localhost:5173}